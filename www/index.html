<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DayLeft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EF;--surface:#FFFFFF;--ink:#14302A;--mute:#5B6F69;--line:#D3DDD8;--accent:#14302A;--accent-ink:#FFFFFF;--red:#C4342A;--amber:#B97300;--green:#2C7A58;--redbg:#FBE9E7;--amberbg:#FFF2D9;--greenbg:#E3F3EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A17;--surface:#182723;--ink:#E6F0EC;--mute:#97ADA6;--line:#2B3F39;--accent:#E6F0EC;--accent-ink:#0F1A17;--red:#FF8A80;--amber:#F2B84B;--green:#6FD3A4;--redbg:#3A1F1C;--amberbg:#3A2E14;--greenbg:#173326}}
:root[data-theme="dark"]{--bg:#0F1A17;--surface:#182723;--ink:#E6F0EC;--mute:#97ADA6;--line:#2B3F39;--accent:#E6F0EC;--accent-ink:#0F1A17;--red:#FF8A80;--amber:#F2B84B;--green:#6FD3A4;--redbg:#3A1F1C;--amberbg:#3A2E14;--greenbg:#173326}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;background:var(--redbg);color:var(--red);font-weight:500}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}.row>button{flex:0 0 auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;width:100%;margin-top:16px}
button.small{min-height:36px;padding:6px 10px;font-size:14px}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.hint.ok{color:var(--green)}.hint.bad{color:var(--red)}
video{width:100%;border-radius:8px;background:#000;margin-top:10px;max-height:240px;object-fit:cover}
ul{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.d{border-radius:8px;text-align:center;padding:8px 0;font-weight:700;font-size:15px}
.d.red{background:var(--redbg);color:var(--red)}.d.amber{background:var(--amberbg);color:var(--amber)}.d.green{background:var(--greenbg);color:var(--green)}
.name{font-weight:500;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--mute);text-align:center;padding:20px 0}
.set{display:flex;gap:8px}.set>*{flex:1}
textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<h1>DayLeft</h1>
<p class="sub" id="summary">바코드를 찍어 등록하고, 기한이 다가오면 알려 드려요.</p>
<div id="banner" class="banner" hidden></div>

<section class="panel" aria-labelledby="addh">
<h2 id="addh">제품 등록</h2>
<label for="barcode">바코드 번호</label>
<div class="row">
<input id="barcode" inputmode="numeric" autocomplete="off" placeholder="8801234567891">
<button id="scanBtn" type="button">카메라로 스캔</button>
</div>
<p class="hint" id="bcHint">숫자를 직접 입력해도 돼요.</p>
<video id="cam" playsinline muted hidden></video>

<label for="name">제품명</label>
<input id="name" autocomplete="off" placeholder="예: 우유 900ml">
<label for="expiry">유통기한</label>
<input id="expiry" type="date">
<label for="shelf">또는 보관 가능 일수 (오늘부터 계산)</label>
<input id="shelf" type="number" inputmode="numeric" min="1" placeholder="예: 7">
<p class="hint">같은 바코드를 다시 찍으면 제품명과 보관 일수를 자동으로 채워요.</p>
<button class="primary" id="saveBtn" type="button">등록하기</button>
</section>

<section class="panel" aria-labelledby="seth">
<h2 id="seth">알림 설정</h2>
<div class="set">
<div><label for="alertDays" style="margin-top:0">며칠 전부터 알릴까요?</label>
<select id="alertDays"><option value="1">1일 전</option><option value="3">3일 전</option><option value="5">5일 전</option><option value="7">7일 전</option></select></div>
<div style="align-self:flex-end"><button id="notiBtn" type="button" style="width:100%">알림 허용</button></div>
</div>
<p class="hint" id="notiHint"></p>
</section>

<section class="panel" aria-labelledby="listh">
<div class="row" style="align-items:center"><h2 id="listh" style="margin:0">내 식품</h2><button class="small" id="demoBtn" type="button" style="flex:0 0 auto">예시 넣기</button></div>
<ul id="list" style="margin-top:8px"></ul>
</section>

<section class="panel" aria-labelledby="histh">
<h2 id="histh">지난 기록</h2>
<p class="sub" id="histSum" style="margin-bottom:8px"></p>
<ul id="hist"></ul>
</section>

<section class="panel" aria-labelledby="bakh">
<h2 id="bakh">백업과 복원</h2>
<p class="hint" style="margin:0 0 12px">기록은 이 브라우저(앱)에 저장돼요. 다른 기기로 옮기거나 브라우저 데이터를 지우기 전에 백업해 두세요.</p>
<div class="set"><button id="exportBtn" type="button">백업 내용 만들기</button><button id="importBtn" type="button">붙여넣은 내용 복원</button></div>
<textarea id="backup" rows="4" aria-label="백업 내용" placeholder="여기에 백업 내용이 나타나요. 복원하려면 붙여넣으세요."></textarea>
<p class="hint" id="backupHint"></p>
</section>
</main>

<script>
(function(){
"use strict";
var K_ITEMS="ek_items",K_DB="ek_products",K_SET="ek_settings",K_HIST="ek_history";
var $=function(id){return document.getElementById(id)};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var items=load(K_ITEMS,[]),db=load(K_DB,{}),settings=load(K_SET,{alertDays:3}),hist=load(K_HIST,[]);
var storageOK=true;try{localStorage.setItem("ek_t","1");localStorage.removeItem("ek_t")}catch(e){storageOK=false}

/* ---- 날짜 계산 ---- */
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function toISO(d){var m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return d.getFullYear()+"-"+m+"-"+dd}
function fromISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function dday(iso){return Math.round((fromISO(iso)-today())/864e5)}

/* ---- 바코드 검증: EAN-13 / EAN-8 / UPC-A 체크디지트 ---- */
function validEAN(code){
  if(!/^\d+$/.test(code)||[8,12,13].indexOf(code.length)<0)return false;
  var digits=code.split("").map(Number),check=digits.pop(),sum=0;
  for(var i=digits.length-1,w=3;i>=0;i--,w=(w===3?1:3))sum+=digits[i]*w;
  return (10-sum%10)%10===check;
}
/* ---- GS1-128 안의 유통기한(AI 17, YYMMDD) 추출 ---- */
function parseGS1Expiry(raw){
  var s=raw.replace(/[\u001d()]/g,"");
  var m=s.match(/17(\d{2})(\d{2})(\d{2})/);
  if(!m||s.length<16)return null;
  var yy=+m[1],mm=+m[2],dd=+m[3];
  if(mm<1||mm>12||dd>31)return null;
  if(dd===0)dd=new Date(2000+yy,mm,0).getDate();
  return toISO(new Date(2000+yy,mm-1,dd));
}

/* ---- 제품 정보 조회 (앱/APK에서는 온라인 조회, 웹 미리보기에서는 조용히 실패) ---- */
function lookupOnline(code){
  return new Promise(function(res){
    var t=setTimeout(function(){res(null)},4000);
    try{
      fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name")
        .then(function(r){return r.json()})
        .then(function(j){clearTimeout(t);res(j&&j.product&&j.product.product_name||null)})
        .catch(function(){clearTimeout(t);res(null)});
    }catch(e){clearTimeout(t);res(null)}
  });
}

/* ---- 바코드 인식 단계 (APK에서는 이 함수만 ML Kit 플러그인으로 교체) ---- */
var stream=null,timer=null;
function stopScan(){
  if(timer){clearInterval(timer);timer=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  $("cam").hidden=true;$("scanBtn").textContent="카메라로 스캔";
}
function startScan(){
  if(stream){stopScan();return}
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices){hint("이 기기에서는 카메라 스캔을 쓸 수 없어요. 번호를 직접 입력해 주세요.","bad");return}
  var det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","code_128"]});
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
    stream=s;var v=$("cam");v.srcObject=s;v.hidden=false;v.play();$("scanBtn").textContent="스캔 중지";
    timer=setInterval(function(){
      det.detect(v).then(function(r){
        if(r.length){var raw=r[0].rawValue;stopScan();onBarcode(raw)}
      }).catch(function(){});
    },300);
  }).catch(function(){hint("카메라 권한이 필요해요. 브라우저 설정에서 허용하거나 번호를 직접 입력해 주세요.","bad")});
}

/* ---- 바코드가 들어온 뒤의 처리 ---- */
function hint(msg,cls){var h=$("bcHint");h.textContent=msg;h.className="hint "+(cls||"")}
function onBarcode(raw){
  raw=String(raw).trim();$("barcode").value=raw;
  var gs1=parseGS1Expiry(raw);
  if(gs1){$("expiry").value=gs1;hint("바코드에 담긴 유통기한("+gs1+")을 읽었어요.","ok")}
  else if(!validEAN(raw)){hint("번호가 올바르지 않아요. 다시 스캔하거나 확인해 주세요.","bad");return}
  var known=db[raw];
  if(known){
    $("name").value=known.name;
    if(known.shelfDays&&!gs1){$("shelf").value=known.shelfDays;$("expiry").value=toISO(addDays(today(),known.shelfDays))}
    if(!gs1)hint("이전에 등록한 제품이에요. 제품명과 기한을 채웠어요.","ok");
  }else if(!gs1){
    hint("처음 보는 제품이에요. 조회 중…");
    lookupOnline(raw).then(function(n){
      if(n&&!$("name").value){$("name").value=n;hint("제품명을 찾았어요. 유통기한을 입력해 주세요.","ok")}
      else hint("제품명과 유통기한을 입력해 주세요. 다음부터는 자동으로 채워져요.");
    });
  }
}

/* ---- 등록 ---- */
function addItem(){
  var code=$("barcode").value.trim(),name=$("name").value.trim(),exp=$("expiry").value,shelf=parseInt($("shelf").value,10);
  if(!name){hint("제품명을 입력해 주세요.","bad");$("name").focus();return}
  if(!exp&&shelf>0)exp=toISO(addDays(today(),shelf));
  if(!exp){hint("유통기한 또는 보관 일수를 입력해 주세요.","bad");$("expiry").focus();return}
  items.push({id:Date.now(),barcode:code,name:name,expiry:exp,notified:""});
  if(code)db[code]={name:name,shelfDays:shelf>0?shelf:(db[code]&&db[code].shelfDays)||0};
  save(K_ITEMS,items);save(K_DB,db);
  ["barcode","name","expiry","shelf"].forEach(function(i){$(i).value=""});
  hint("등록했어요.","ok");render();checkAlerts();
}

/* ---- 목록 ---- */
function tone(n){return n<=1?"red":n<=settings.alertDays?"amber":"green"}
function label(n){return n<0?"D+"+(-n):n===0?"오늘":"D-"+n}
function render(){
  items.sort(function(a,b){return a.expiry<b.expiry?-1:a.expiry>b.expiry?1:0});
  var ul=$("list");ul.innerHTML="";
  if(!items.length){var e=document.createElement("li");e.className="empty";e.textContent="아직 등록한 식품이 없어요. 위에서 바코드를 스캔해 보세요.";ul.appendChild(e)}
  items.forEach(function(it){
    var n=dday(it.expiry),li=document.createElement("li");li.className="item";
    var d=document.createElement("div");d.className="d "+tone(n);d.textContent=label(n);
    var mid=document.createElement("div"),nm=document.createElement("div"),mt=document.createElement("div");
    nm.className="name";nm.textContent=it.name;mt.className="meta";mt.textContent=it.expiry+(n<0?" · 기한 지남":"");
    mid.appendChild(nm);mid.appendChild(mt);
    var acts=document.createElement("div");acts.className="acts";
    var ate=document.createElement("button");ate.className="small";ate.textContent="먹었어요";ate.onclick=function(){finish(it.id,"eaten")};
    var del=document.createElement("button");del.className="small";del.textContent="버렸어요";del.onclick=function(){finish(it.id,"discarded")};
    acts.appendChild(ate);acts.appendChild(del);
    li.appendChild(d);li.appendChild(mid);li.appendChild(acts);ul.appendChild(li);
  });
  var urgent=items.filter(function(i){return dday(i.expiry)<=settings.alertDays});
  var b=$("banner");
  if(urgent.length){b.hidden=false;b.textContent="기한이 임박했거나 지난 식품이 "+urgent.length+"개 있어요: "+urgent.slice(0,3).map(function(i){return i.name}).join(", ")+(urgent.length>3?" 외":"")}
  else b.hidden=true;
  $("summary").textContent=items.length?("등록된 식품 "+items.length+"개 · 임박 "+urgent.length+"개"):"바코드를 찍어 등록하고, 기한이 다가오면 알려 드려요.";
}
/* ---- 지난 기록: 먹었거나 버린 식품을 지우지 않고 보관 ---- */
function finish(id,status){
  var it=items.filter(function(i){return i.id===id})[0];if(!it)return;
  items=items.filter(function(i){return i.id!==id});
  hist.unshift({id:it.id,barcode:it.barcode,name:it.name,expiry:it.expiry,status:status,doneAt:toISO(today())});
  save(K_ITEMS,items);save(K_HIST,hist);render();renderHist();
}
function restore(id){
  var h=hist.filter(function(i){return i.id===id})[0];if(!h)return;
  hist=hist.filter(function(i){return i.id!==id});
  items.push({id:h.id,barcode:h.barcode,name:h.name,expiry:h.expiry,notified:""});
  save(K_ITEMS,items);save(K_HIST,hist);render();renderHist();
}
function renderHist(){
  var ul=$("hist");ul.innerHTML="";
  var eaten=hist.filter(function(h){return h.status==="eaten"}).length,lost=hist.length-eaten;
  $("histSum").textContent=hist.length?("먹은 "+eaten+"개 · 버린 "+lost+"개 · 버린 비율 "+Math.round(lost/hist.length*100)+"%"):"먹었거나 버린 식품이 여기에 기록돼요.";
  hist.forEach(function(h){
    var li=document.createElement("li");li.className="item";
    var d=document.createElement("div");d.className="d "+(h.status==="eaten"?"green":"red");d.textContent=h.status==="eaten"?"먹음":"버림";
    var mid=document.createElement("div"),nm=document.createElement("div"),mt=document.createElement("div");
    nm.className="name";nm.textContent=h.name;mt.className="meta";mt.textContent="기한 "+h.expiry+" · 처리 "+h.doneAt;
    mid.appendChild(nm);mid.appendChild(mt);
    var acts=document.createElement("div");acts.className="acts";
    var re=document.createElement("button");re.className="small";re.textContent="다시 등록";re.onclick=function(){restore(h.id)};
    acts.appendChild(re);li.appendChild(d);li.appendChild(mid);li.appendChild(acts);ul.appendChild(li);
  });
}

/* ---- 백업과 복원 ---- */
function bmsg(m,cls){var h=$("backupHint");h.textContent=m;h.className="hint "+(cls||"")}
function validDate(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function exportData(){
  var s=JSON.stringify({items:items,hist:hist,db:db,settings:settings});
  $("backup").value=s;
  try{navigator.clipboard.writeText(s).then(function(){bmsg("복사했어요. 메모장이나 메신저 '나에게 보내기'에 붙여넣어 보관하세요.","ok")},function(){bmsg("위 내용을 직접 복사해서 보관하세요.","ok")})}catch(e){bmsg("위 내용을 직접 복사해서 보관하세요.","ok")}
}
function importData(){
  var o;try{o=JSON.parse($("backup").value)}catch(e){bmsg("백업 내용을 읽을 수 없어요. 전체를 그대로 붙여넣었는지 확인해 주세요.","bad");return}
  if(!o||typeof o!=="object"){bmsg("백업 내용이 올바르지 않아요.","bad");return}
  var n=0,seen={};
  items.forEach(function(i){seen[i.id]=1});
  (o.items||[]).forEach(function(i){if(i&&i.id&&i.name&&validDate(i.expiry)&&!seen[i.id]){items.push({id:i.id,barcode:i.barcode||"",name:String(i.name),expiry:i.expiry,notified:""});seen[i.id]=1;n++}});
  hist.forEach(function(i){seen[i.id]=1});
  (o.hist||[]).forEach(function(i){if(i&&i.id&&i.name&&validDate(i.expiry)&&!seen[i.id]){hist.push({id:i.id,barcode:i.barcode||"",name:String(i.name),expiry:i.expiry,status:i.status==="eaten"?"eaten":"discarded",doneAt:validDate(i.doneAt)?i.doneAt:i.expiry});seen[i.id]=1;n++}});
  var dbo=o.db||{};Object.keys(dbo).forEach(function(k){if(dbo[k]&&dbo[k].name)db[k]={name:String(dbo[k].name),shelfDays:+dbo[k].shelfDays||0}});
  hist.sort(function(a,b){return a.doneAt<b.doneAt?1:a.doneAt>b.doneAt?-1:0});
  save(K_ITEMS,items);save(K_HIST,hist);save(K_DB,db);render();renderHist();
  bmsg(n+"개 기록을 복원했어요.","ok");
}

/* ---- 알림 (웹: Notification API / APK: Capacitor LocalNotifications로 교체) ---- */
function notiState(){
  var h=$("notiHint");
  if(!("Notification" in window)){h.textContent="이 환경에서는 시스템 알림을 쓸 수 없어요. 화면 상단 배너로 알려 드려요."}
  else if(Notification.permission==="granted")h.textContent="알림이 켜져 있어요. 앱을 열 때와 열려 있는 동안 확인해요."
  else if(Notification.permission==="denied")h.textContent="알림이 차단되어 있어요. 브라우저 설정에서 허용해 주세요."
  else h.textContent="알림을 허용하면 임박한 식품을 알려 드려요.";
}
function checkAlerts(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  var t=toISO(today()),changed=false;
  items.forEach(function(it){
    if(dday(it.expiry)<=settings.alertDays&&it.notified!==t){
      try{new Notification("유통기한 알림",{body:it.name+" · "+label(dday(it.expiry))+" ("+it.expiry+")"});it.notified=t;changed=true}catch(e){}
    }
  });
  if(changed)save(K_ITEMS,items);
}

/* ---- 예시 데이터 ---- */
function demo(){
  var base=today();
  [["서울우유 900ml","8801115114154",1],["두부 300g","8801007123452",4],["요거트 4입","8801104940532",9],["식빵","8801068100028",-1]].forEach(function(r,i){
    items.push({id:Date.now()+i,barcode:r[1],name:r[0],expiry:toISO(addDays(base,r[2])),notified:""});
  });
  save(K_ITEMS,items);render();checkAlerts();
}

$("scanBtn").onclick=startScan;
$("saveBtn").onclick=addItem;
$("demoBtn").onclick=demo;
$("barcode").addEventListener("change",function(){var v=this.value.trim();if(v)onBarcode(v)});
$("alertDays").value=String(settings.alertDays);
$("alertDays").onchange=function(){settings.alertDays=+this.value;save(K_SET,settings);render();checkAlerts()};
$("notiBtn").onclick=function(){
  if(!("Notification" in window))return notiState();
  Notification.requestPermission().then(function(){notiState();checkAlerts()});
};
$("exportBtn").onclick=exportData;$("importBtn").onclick=importData;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(!storageOK)bmsg("이 환경에서는 저장이 막혀 있어서 닫으면 기록이 사라질 수 있어요. 백업 내용을 따로 보관해 주세요.","bad");
notiState();render();renderHist();checkAlerts();setInterval(function(){render();checkAlerts()},36e5);
})();
</script>
